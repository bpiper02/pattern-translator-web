name: Audio Intelligence QA

on:
  push:
    branches:
      - feat/audio-intelligence-overhaul
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Current detector baseline
        run: node qa/audio-intelligence-baseline.mjs

      - name: Compile voice rhythm detector for regression
        run: npx tsc src/analysis/voiceRhythm.ts --outDir .qa-dist --target ES2022 --module ES2022 --moduleResolution Bundler --skipLibCheck

      - name: Voice rhythm regression
        run: node qa/voice-rhythm-regression.mjs

      - name: Build
        run: npm run build
