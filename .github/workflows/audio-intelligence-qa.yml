name: Audio Intelligence QA

on:
  push:
    branches:
      - feat/audio-intelligence-overhaul
      - spike/melody-transcription-bakeoff
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Current detector baseline
        run: node qa/audio-intelligence-baseline.mjs

      - name: Compile audio intelligence modules for regression
        run: npx tsc src/analysis/voiceRhythm.ts src/analysis/rhythmCapture.ts src/analysis/voiceMelody.ts --outDir .qa-dist --target ES2022 --module ES2022 --moduleResolution Bundler --skipLibCheck

      - name: Voice rhythm regression
        run: node qa/voice-rhythm-regression.mjs

      - name: Rhythm capture grid regression
        run: node qa/rhythm-capture-grid.mjs

      - name: Production voice melody regression
        run: node qa/voice-melody-regression.mjs

      - name: Essentia YIN pitch spike
        if: github.ref_name == 'spike/melody-transcription-bakeoff'
        continue-on-error: true
        run: node qa/essentia-pitch-spike.cjs

      - name: Essentia Melodia pitch spike
        if: github.ref_name == 'spike/melody-transcription-bakeoff'
        continue-on-error: true
        run: node qa/essentia-melodia-spike.cjs

      - name: Essentia probabilistic YIN bakeoff
        if: github.ref_name == 'spike/melody-transcription-bakeoff'
        continue-on-error: true
        run: node qa/essentia-pyin-spike.cjs

      - name: Corrected melody bakeoff v2
        if: github.ref_name == 'spike/melody-transcription-bakeoff'
        continue-on-error: true
        run: node qa/melody-bakeoff-v2.cjs

      # Basic Pitch scripts remain archived for reproducibility. The earlier
      # vibrato verdict is no longer considered valid because the v1 synthetic
      # fixture modulated frequency without integrating phase. Re-run Basic
      # Pitch only if the corrected Essentia bakeoff does not produce a winner.

      - name: Build
        run: npm run build
